name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Repora is workspace-first: changes that improve multi-repository awareness are
        preferred over single-repository depth.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which workflow is painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like Repora to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This affects more than one repository at once
        - label: This is specific to one repository
        - label: This is about the terminal interface
